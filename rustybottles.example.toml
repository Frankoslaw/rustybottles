[app]
workdir = "./.rustybottles" # default ~/.rustybottles
cleanup_workdir = false
source_strategy = "copy" # copy, move or none
delete_original = false

[extract]
force = true
password = "password"
extract_recursive = true
extract_until = "executable" # executable, noarchives, maxdepth
use_innermost = true

[executable]
search_recursive = false
search_pattern = "*.exe"
use_longest_name = true

[bottles]
root = "~/.var/app/com.usebottles.bottles/data/bottles/bottles"
bottle = "games-unsafe-rpgmaker"
default_install_path = "drive_c/users/Public/Documents/games-unsafe-rpgmaker"
create_shortcut = true
shortcut_tmpl = "{game_name} (rustbottles) ({date})"

[overrides.rpgmaker]
search_files = ["www", "Game.rgss3a", "package.json", "manifest.json"]
search_recursive = false

[overrides.rpgmaker.bottles]
bottle = "games-unsafe-rpgmaker"
install_path = "drive_c/users/Public/Documents/games-unsafe-rpgmaker"

[overrides.unity]
search_files = ["UnityPlayer*.*", "UnityCrashHandler*.*", "MonoBleedingEdge"]
search_recursive = false