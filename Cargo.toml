[package]
name = "rustybottles"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
log = "0.4.29"
pretty_env_logger = "0.5.0"

clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
glob = "0.3.3"
shellexpand = "3.1.2"

# Supported archive formats
zip = "8.6.0"
sevenz-rust2 = { version = "0.21.0", features = ["deflate", "lz4", "zstd"] }
unrar = "0.5.8"
walkdir = "2.5.0"

# Bottles yaml format
uuid = { version = "1.23.1", features = ["v4"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
chrono = "0.4.44"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
tempfile = "3.25.0"

[dev-dependencies]
tempfile = "3.25.0"
